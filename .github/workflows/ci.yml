name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "infra/**"
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "infra/**"

jobs:
  validate:
    uses: ./.github/workflows/reusable-node-validate.yml
    with:
      node_version: "24"
      upload_coverage: true