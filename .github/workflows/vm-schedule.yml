# Liga a VM antes do horário do bot (17h–23h) e desaloca depois para reduzir custo.
# Horários abaixo em UTC, equivalentes a America/Sao_Paulo (UTC−3, sem horário de verão):
#   16:50 BRT → start    (cron 50 19 * * *)
#   23:05 BRT → deallocate (cron 5 2 * * *, dia seguinte em UTC)
name: VM Schedule (bot hours)

on:
  schedule:
    - cron: "50 19 * * *"
    - cron: "5 2 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "start = ligar VM | deallocate = parar cobrança de compute"
        required: true
        type: choice
        options:
          - start
          - deallocate

concurrency:
  group: vm-schedule
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  vm_power:
    name: VM ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'scheduled' }}
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME || secrets.AZURE_VM_NAME }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || secrets.PUBLIC_BASE_URL }}
    steps:
      - name: Resolver ação (start ou deallocate)
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "50 19 * * *") echo "action=start" >> "$GITHUB_OUTPUT" ;;
            "5 2 * * *")   echo "action=deallocate" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Cron desconhecido: ${{ github.event.schedule }}"
              exit 1
              ;;
          esac

      - name: Validar configuração
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ]; then
            echo "::error::Defina AZURE_RESOURCE_GROUP (variable ou secret no repositório)."
            exit 1
          fi
          if [ -z "${AZURE_VM_NAME:-}" ]; then
            echo "::error::Defina AZURE_VM_NAME (variable ou secret no repositório)."
            exit 1
          fi
          if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "auth=oidc" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "auth=credentials" >> "$GITHUB_ENV"
          else
            echo "::error::Configure OIDC (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) ou secret AZURE_CREDENTIALS."
            exit 1
          fi

      - name: Azure login (OIDC)
        if: env.auth == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal JSON)
        if: env.auth == 'credentials'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        if: steps.resolve.outputs.action == 'start'
        run: |
          set -euo pipefail
          echo "Iniciando VM '${AZURE_VM_NAME}' no RG '${AZURE_RESOURCE_GROUP}'..."
          az vm start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME"
          ok=0
          for i in $(seq 1 36); do
            power="$(az vm get-instance-view \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)"
            echo "Tentativa $i/36 — ${power:-desconhecido}"
            if [ "$power" = "PowerState/running" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::VM não chegou a PowerState/running a tempo."
            exit 1
          fi

      - name: Smoke test após start (API)
        if: steps.resolve.outputs.action == 'start' && env.PUBLIC_BASE_URL != ''
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$PUBLIC_BASE_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"
          BASE_URL="${BASE_URL%/}"
          echo "Aguardando stack Docker (ate ~8 min) em ${BASE_URL}..."
          ok=0
          for i in $(seq 1 40); do
            for path in /healthz /api/healthz; do
              code="$(curl -sS -o /tmp/healthz.json -w '%{http_code}' "${BASE_URL}${path}" 2>/dev/null || true)"
              if [ "$code" = "200" ]; then
                echo "Health OK: ${BASE_URL}${path}"
                ok=1
                break 2
              fi
            done
            echo "Tentativa $i/40 — aguardando 12s..."
            sleep 12
          done
          if [ "$ok" -ne 1 ]; then
            echo "::warning::API não respondeu 200 a tempo. VM ligada; verifique docker compose na VM."
            cat /tmp/healthz.json 2>/dev/null || true
            exit 0
          fi
          echo "API OK"
          cat /tmp/healthz.json

      - name: Deallocate VM
        if: steps.resolve.outputs.action == 'deallocate'
        run: |
          set -euo pipefail
          echo "Desalocando VM '${AZURE_VM_NAME}' (para de cobrança de compute)..."
          az vm deallocate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME"
          power="$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)"
          echo "Power state: ${power}"
          if [ "$power" != "PowerState/deallocated" ] && [ "$power" != "PowerState/stopped" ]; then
            echo "::warning::Estado inesperado após deallocate: ${power}"
          fi
          echo "VM desalocada. Bot fora do ar até o próximo start agendado."
