name: Reusable deploy VM Docker

on:
  workflow_call:
    inputs:
      deploy_scope:
        required: true
        type: string

jobs:
  deploy_vm_docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME || secrets.AZURE_VM_NAME }}
    steps:
      - uses: actions/checkout@v5

      - name: Validar variaveis obrigatorias
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER || secrets.AZURE_VM_USER }}
          VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VM_HOST:-}" ]; then
            echo "::error::Defina AZURE_VM_HOST (secret ou variable) com o IP/DNS publico da VM."
            exit 1
          fi
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "::error::Defina AZURE_VM_SSH_PRIVATE_KEY (secret) com a chave privada SSH da VM."
            exit 1
          fi
          if [ -z "${VM_USER:-}" ]; then
            echo "AZURE_VM_USER nao informado; usando 'azureuser'."
          fi

      - name: Validar Azure (ligar VM automaticamente)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -eo pipefail
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${AZURE_VM_NAME:-}" ]; then
            echo "::warning::AZURE_RESOURCE_GROUP ou AZURE_VM_NAME ausentes; deploy nao liga a VM sozinho."
            echo "auto_start_vm=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "${AZURE_CLIENT_ID:-}" ] && [ -n "${AZURE_TENANT_ID:-}" ] && [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "auth=oidc" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "auth=credentials" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem OIDC nem AZURE_CREDENTIALS; ligue a VM manualmente (VM schedule -> start)."
            echo "auto_start_vm=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "auto_start_vm=true" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        if: env.auto_start_vm == 'true' && env.auth == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (service principal JSON)
        if: env.auto_start_vm == 'true' && env.auth == 'credentials'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ligar VM se estiver desligada
        if: env.auto_start_vm == 'true'
        run: |
          set -eo pipefail
          power="$(az vm get-instance-view \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv 2>/dev/null || true)"
          echo "Estado atual: ${power:-desconhecido}"
          if [ "$power" = "PowerState/running" ]; then
            echo "VM ja esta ligada."
            exit 0
          fi
          echo "Iniciando VM ${AZURE_VM_NAME}..."
          az vm start --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_VM_NAME"
          ok=0
          for i in $(seq 1 36); do
            power="$(az vm get-instance-view \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --query "instanceView.statuses[?starts_with(code, 'PowerState/')].code | [0]" -o tsv)"
            echo "Aguardando running (${i}/36): ${power}"
            if [ "$power" = "PowerState/running" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::VM nao chegou a running apos az vm start."
            exit 1
          fi
          echo "VM running. Aguardando SSH (ate ~4 min)..."

      - name: Preparar chave SSH
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
          VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm_deploy
          chmod 600 ~/.ssh/id_vm_deploy
          touch ~/.ssh/known_hosts
          # ssh-keyscan falha se a VM estiver desligada (vm-schedule 23h). Nao abortar aqui.
          if ! ssh-keyscan -T 20 -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::warning::ssh-keyscan nao alcançou $VM_HOST (VM desligada ou DNS errado). Tentando SSH com accept-new."
          fi

      - name: Aguardar SSH na VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER || secrets.AZURE_VM_USER }}
        run: |
          set -eo pipefail
          VM_USER="${VM_USER:-azureuser}"
          ok=0
          for i in $(seq 1 24); do
            if ssh -i ~/.ssh/id_vm_deploy -o BatchMode=yes -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              "${VM_USER}@${VM_HOST}" 'echo VM_SSH_OK' 2>/dev/null; then
              echo "SSH OK em ${VM_USER}@${VM_HOST} (tentativa ${i}/24)"
              ok=1
              break
            fi
            echo "SSH tentativa ${i}/24 — aguardando 10s..."
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::SSH indisponivel em ${VM_HOST}."
            echo "Confira AZURE_VM_HOST, NSG porta 22 e se a VM esta running."
            exit 1
          fi

      - name: Empacotar projeto para deploy
        run: |
          set -euo pipefail
          mkdir -p /tmp/procon-deploy
          rm -f /tmp/procon-deploy/vm-docker-deploy.tgz
          rm -f security/.wwebjs_auth/session/SingletonLock || true
          rm -f security/.wwebjs_auth/session/SingletonCookie || true
          rm -f security/.wwebjs_auth/session/SingletonSocket || true
          rm -f security/.wwebjs_auth/session/DevToolsActivePort || true
          tar -czf /tmp/procon-deploy/vm-docker-deploy.tgz \
            --exclude=.git \
            --exclude=.cursor \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=data \
            --exclude=painel-interno/node_modules \
            --exclude=painel-interno/dist \
            --exclude=tmp \
            --exclude=vm-docker-deploy.tgz \
            .

      - name: Upload e deploy na VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST || vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER || secrets.AZURE_VM_USER }}
          PAINEL_VITE_ADMIN_PANEL_TOKEN: ${{ secrets.PAINEL_VITE_ADMIN_PANEL_TOKEN }}
          PAINEL_VITE_AZURE_CLIENT_ID: ${{ secrets.PAINEL_VITE_AZURE_CLIENT_ID }}
          PAINEL_VITE_AZURE_TENANT_ID: ${{ secrets.PAINEL_VITE_AZURE_TENANT_ID }}
          PAINEL_VITE_AZURE_REDIRECT_URI: ${{ secrets.PAINEL_VITE_AZURE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          VM_USER="${VM_USER:-azureuser}"
          REMOTE="${VM_USER}@${VM_HOST}"

          scp -i ~/.ssh/id_vm_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            /tmp/procon-deploy/vm-docker-deploy.tgz "$REMOTE:/tmp/vm-docker-deploy.tgz"

          ssh -i ~/.ssh/id_vm_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$REMOTE" <<EOF
          set -euo pipefail
          sudo mkdir -p /opt/procon-bot
          sudo tar -xzf /tmp/vm-docker-deploy.tgz -C /opt/procon-bot
          sudo chown -R \$USER:\$USER /opt/procon-bot
          cd /opt/procon-bot
          printf '%s\n' \
            "PAINEL_VITE_ADMIN_PANEL_TOKEN=${PAINEL_VITE_ADMIN_PANEL_TOKEN}" \
            "PAINEL_VITE_AZURE_CLIENT_ID=${PAINEL_VITE_AZURE_CLIENT_ID}" \
            "PAINEL_VITE_AZURE_TENANT_ID=${PAINEL_VITE_AZURE_TENANT_ID}" \
            "PAINEL_VITE_AZURE_REDIRECT_URI=${PAINEL_VITE_AZURE_REDIRECT_URI}" \
            > .deploy.env
          set -a
          . ./.deploy.env
          set +a
          sudo docker compose up -d --build
          sudo docker compose ps
          EOF

      - name: Smoke test pos-deploy
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || secrets.PUBLIC_BASE_URL || 'https://proconbotdockcl0428.chilecentral.cloudapp.azure.com' }}
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "${PUBLIC_BASE_URL}" | tr -d '\r\n' | sed 's/[[:space:]]*$//')"
          BASE_URL="${BASE_URL%/}"
          if [ -z "${BASE_URL}" ]; then
            echo "::error::PUBLIC_BASE_URL ficou vazio após sanitização."
            exit 1
          fi
          API_URL="${BASE_URL}/api/healthz"
          UI_URL="${BASE_URL}/"
          echo "Validando API: ${API_URL}"
          ok_api=0
          for i in {1..20}; do
            code="$(curl -sS -o /tmp/api-healthz.json -w '%{http_code}' "$API_URL" || true)"
            if [ "$code" = "200" ]; then
              ok_api=1
              break
            fi
            echo "API tentativa $i/20 retornou HTTP $code; aguardando 6s..."
            sleep 6
          done
          if [ "$ok_api" -ne 1 ]; then
            echo "::error::API nao ficou saudavel em tempo habil."
            echo "Ultima resposta API:"
            cat /tmp/api-healthz.json || true
            exit 1
          fi
          echo "Validando painel: ${UI_URL}"
          ok_ui=0
          for i in {1..20}; do
            code="$(curl -I -sS -o /tmp/ui-head.txt -w '%{http_code}' "$UI_URL" || true)"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              ok_ui=1
              break
            fi
            echo "UI tentativa $i/20 retornou HTTP $code; aguardando 6s..."
            sleep 6
          done
          if [ "$ok_ui" -ne 1 ]; then
            echo "::error::Painel nao respondeu com sucesso em tempo habil."
            echo "Ultimos headers UI:"
            cat /tmp/ui-head.txt || true
            exit 1
          fi
          echo "Deploy '${{ inputs.deploy_scope }}' finalizado com sucesso."
