# Build da imagem no GitHub Actions, push para o ACR e deploy no Container App (nova revisao).
# Segredo: AZURE_CREDENTIALS (JSON de `az ad sp create-for-rbac --sdk-auth`).
# O service principal precisa de permissoes no RG (ex.: Contributor) ou equivalentes para:
# ACR push, Microsoft.App/containerApps/write, storage account keys, role assignments AcrPull/Key Vault.
# Em push para main/master: tag de imagem padrao v1 (igual deploy-containerapp.ps1 -ImageTag v1).
name: acr-build-push
# Titulo da execucao na aba Actions: imagem completa ao lado do fluxo
# Padrao: assinatura 'Azure for Students' + rg-procon-bot-cl (ver deploy-containerapp.ps1).
# Se usar outro ambiente, defina repository variables: ACR_NAME, AZURE_RG, ACA_ENV, STORAGE, KV, SHARE.
run-name: ACR build/push procon-bot:${{ github.event.inputs.image_tag || 'v1' }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem no ACR (ex.: v1)"
        required: true
        default: "v1"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "infra/azure/gha-deploy-containerapp.sh"
      - "infra/azure/apply-persist-volume.mjs"

concurrency:
  group: acr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/reusable-node-validate.yml
    with:
      node_version: "24"
      upload_coverage: false

  build_push:
    name: Build e push no ACR (procon-bot:${{ github.event.inputs.image_tag || 'v1' }})
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.acr.outputs.image_tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login, build e push
        id: acr
        env:
          # Igual infra/azure/deploy-containerapp.ps1 (CL). Sobrescreva via repo variables se precisar.
          ACR_NAME: ${{ vars.ACR_NAME || 'acrproconbotcl' }}
          AZURE_RG: ${{ vars.AZURE_RG || 'rg-procon-bot-cl' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'v1' }}
        run: |
          set -e
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          az acr login --name "$ACR_NAME"
          ACR_SERVER=$(az acr show -n "$ACR_NAME" -g "$AZURE_RG" --query loginServer -o tsv)
          IMAGE="$ACR_SERVER/procon-bot:$IMAGE_TAG"
          docker build -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          echo "Pushed: $IMAGE"

  deploy:
    needs: build_push
    name: Deploy procon-bot:${{ needs.build_push.outputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App (nova revisao com imagem + volume)
        env:
          IMAGE_TAG: ${{ needs.build_push.outputs.image_tag }}
          # Mesmos nomes default que deploy-containerapp.ps1
          RG: ${{ vars.AZURE_RG || 'rg-procon-bot-cl' }}
          ACR: ${{ vars.ACR_NAME || 'acrproconbotcl' }}
          ENV_NAME: ${{ vars.ACA_ENV || 'acae-procon-bot-cl' }}
          STORAGE: ${{ vars.ACA_STORAGE || 'stproconbotclprod' }}
          SHARE: ${{ vars.ACA_FILE_SHARE || 'botpersistshare' }}
          KV: ${{ vars.ACA_KEYVAULT || 'kv-procon-bot-cl' }}
        run: |
          set -e
          chmod +x infra/azure/gha-deploy-containerapp.sh
          ./infra/azure/gha-deploy-containerapp.sh

  smoke_verify:
    needs: deploy
    name: Verificar revisao ativa no Azure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Smoke check da revisao mais recente
        env:
          RG: ${{ vars.AZURE_RG || 'rg-procon-bot-cl' }}
          APP: procon-bot
          SMOKE_MAX_ATTEMPTS: ${{ vars.SMOKE_MAX_ATTEMPTS || '100' }}
          SMOKE_SLEEP_SECONDS: ${{ vars.SMOKE_SLEEP_SECONDS || '20' }}
        run: |
          set -euo pipefail
          latest="$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)"
          if [ -z "$latest" ]; then
            echo "::error::Nao foi possivel obter latestRevisionName."
            exit 1
          fi
          echo "latestRevisionName=$latest"

          # Startup TCP :3000 + copia grande Azure Files->/tmp pode manter Activating por muitos minutos
          # (alinhar com startup probe: ate ~20min apos comecar a escutar).
          max_attempts="${SMOKE_MAX_ATTEMPTS:-100}"
          sleep_seconds="${SMOKE_SLEEP_SECONDS:-20}"
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            active="$(az containerapp revision show -n "$APP" -g "$RG" --revision "$latest" --query properties.active -o tsv)"
            running="$(az containerapp revision show -n "$APP" -g "$RG" --revision "$latest" --query properties.runningState -o tsv)"
            health="$(az containerapp show -n "$APP" -g "$RG" --query properties.runningStatus -o tsv)"

            echo "attempt=$attempt/$max_attempts revision.active=$active revision.runningState=$running app.runningStatus=$health"

            if [ "$active" != "true" ]; then
              echo "::error::Revisao mais recente nao esta ativa."
              exit 1
            fi

            case "$running" in
              Running|RunningAtMaxScale|RunningAtMinScale)
                echo "Smoke check OK: revisao em estado Running*."
                exit 0
                ;;
              Activating|Provisioning)
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "::error::Revisao ainda em estado transitorio apos espera: $running"
                  exit 1
                fi
                echo "Revisao ainda em transicao ($running). Aguardando ${sleep_seconds}s..."
                sleep "$sleep_seconds"
                ;;
              *)
                echo "::error::Revisao com runningState inesperado: $running"
                exit 1
                ;;
            esac

            attempt=$((attempt + 1))
          done
