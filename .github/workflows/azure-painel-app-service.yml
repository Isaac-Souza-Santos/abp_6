name: Deploy painel VM Docker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "painel-interno/**"
      - ".github/workflows/azure-painel-app-service.yml"

concurrency:
  group: deploy-painel-appservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_vm_docker_painel:
    uses: ./.github/workflows/reusable-deploy-vm-docker.yml
    with:
      deploy_scope: "painel"
