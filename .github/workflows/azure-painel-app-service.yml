# Publica o painel interno num Azure App Service (Linux + Node).
# Pré-requisito: App Service já criado (ex.: infra/azure/deploy-painel-app-service.ps1 uma vez).
#
# Segredos (igual ao fluxo acr-build-push):
#   AZURE_CREDENTIALS   — JSON do service principal. Tem de ter RBAC no RG do painel (ex. rg-procon-bot-prod):
#                         Portal -> RG -> Access control (IAM) -> Add role assignment -> Website Contributor
#                         (ou Contributor) no principal usado pelo GitHub. Se o SP so tiver acesso a rg-procon-bot-cl,
#                         AuthorizationFailed em Microsoft.Web/sites/read no deploy do painel.
#   AZURE_WEBAPP_NAME   — nome do App Service (Overview → Name), uma linha, sem URL
#   PAINEL_VITE_API_BASE_URL
#   PAINEL_VITE_ADMIN_PANEL_TOKEN — opcional
#   PAINEL_VITE_AZURE_CLIENT_ID     — opcional (login MSAL no painel)
#   PAINEL_VITE_AZURE_TENANT_ID     — opcional
#   PAINEL_VITE_AZURE_REDIRECT_URI  — opcional (ex.: https://app-painel-xxx.azurewebsites.net/)
#
# Variáveis de repositório (opcional):
#   AZURE_WEBAPP_RG      — resource group do App Service do painel (prioridade sobre AZURE_RG)
#   AZURE_RG             — fallback; default rg-procon-bot-prod
#   AZURE_SUBSCRIPTION_ID — GUID da subscrição onde está o RG (se o SP tiver varias e a default nao for a do painel)
#
# Nota: `azure/webapps-deploy` (publish profile) falhava com ENOTFOUND / DNS em alguns runners; o deploy
# passa a ser `az webapp deploy` após `azure/login`, sem depender do hostname scm no Node.

name: Deploy painel App Service

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "painel-interno/**"
      - ".github/workflows/azure-painel-app-service.yml"

concurrency:
  group: deploy-painel-appservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: painel-interno/package-lock.json

      - name: Build Vite e empacotar para App Service
        env:
          VITE_API_BASE_URL: ${{ secrets.PAINEL_VITE_API_BASE_URL }}
          VITE_ADMIN_PANEL_TOKEN: ${{ secrets.PAINEL_VITE_ADMIN_PANEL_TOKEN }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.PAINEL_VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.PAINEL_VITE_AZURE_TENANT_ID }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.PAINEL_VITE_AZURE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Defina o segredo PAINEL_VITE_API_BASE_URL (URL do Container App, sem barra final)."
            exit 1
          fi
          cd painel-interno
          npm ci
          npm run build
          mkdir -p _deploy/dist
          cp -r dist/* _deploy/dist/
          cp azure-app-service-host/package.json azure-app-service-host/server.mjs _deploy/
          cd _deploy
          npm install --omit=dev
          zip -r "$GITHUB_WORKSPACE/painel-app-service.zip" .

      - name: Verificar segredos Azure (CLI deploy)
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error::Segredo AZURE_CREDENTIALS vazio. Use o mesmo JSON que no workflow acr-build-push (service principal com acesso ao RG / Web App)."
            exit 1
          fi
          if [ -z "${AZURE_WEBAPP_NAME:-}" ]; then
            echo "::error::Segredo AZURE_WEBAPP_NAME vazio. Nome exacto do App Service (Overview → Name)."
            exit 1
          fi

      - name: Normalizar nome do Web App
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "$AZURE_WEBAPP_NAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          APP="${RAW#https://}"
          APP="${APP#http://}"
          APP="${APP%%/*}"
          APP="${APP%%\?*}"
          case "$APP" in
            *.scm.azurewebsites.us) APP="${APP%.scm.azurewebsites.us}" ;;
            *.scm.azurewebsites.net) APP="${APP%.scm.azurewebsites.net}" ;;
          esac
          case "$APP" in
            *.azurewebsites.us) APP="${APP%.azurewebsites.us}" ;;
            *.azurewebsites.net) APP="${APP%.azurewebsites.net}" ;;
          esac
          APP=$(printf '%s' "$APP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$APP" ]; then
            echo "::error::AZURE_WEBAPP_NAME ficou vazio apos normalizar."
            exit 1
          fi
          if printf '%s' "$APP" | grep -q '[.]'; then
            echo "::error::Use apenas o Resource name do App Service (sem dominio)."
            exit 1
          fi
          echo "Nome normalizado: comprimento ${#APP} caracteres."
          echo "AZURE_WEBAPP_NAME_TRIMMED=$APP" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Selecionar subscricao (opcional)
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${AZURE_SUBSCRIPTION_ID:-}" ]; then
            echo "A usar variavel AZURE_SUBSCRIPTION_ID para az account set."
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          fi
          echo "Subscricao ativa:"
          az account show --query "{name:name, id:id}" -o table

      - name: Validar Web App (RG + nome)
        env:
          RG: ${{ vars.AZURE_WEBAPP_RG || vars.AZURE_RG || 'rg-procon-bot-prod' }}
        run: |
          set -euo pipefail
          echo "Resource group do deploy: $RG"
          set +e
          OUT=$(az webapp show -g "$RG" -n "$AZURE_WEBAPP_NAME_TRIMMED" --query id -o tsv 2>&1)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$OUT" ]; then
            echo "::error::az webapp show falhou (exit $RC). Resposta: $OUT"
            echo "Web Apps neste RG (ajuste AZURE_WEBAPP_NAME ao Name listado):"
            az webapp list -g "$RG" --query "[].name" -o table 2>&1 || true
            if echo "$OUT" | grep -qi AuthorizationFailed; then
              SUB="$(az account show --query id -o tsv 2>/dev/null || true)"
              echo "::error::RBAC: o service principal de AZURE_CREDENTIALS nao tem Microsoft.Web/sites/read no RG '$RG'. Portal: RG -> IAM -> Website Contributor (ou Contributor) no principal do deploy. CLI: az role assignment create --assignee-object-id OBJECT_ID --assignee-principal-type ServicePrincipal --role \"Website Contributor\" --scope \"/subscriptions/${SUB}/resourceGroups/${RG}\""
            else
              echo "::error::Ajuste AZURE_WEBAPP_NAME ao Name listado; se vazio, verifique AZURE_SUBSCRIPTION_ID e permissoes no RG."
            fi
            exit 1
          fi
          echo "Web App encontrado."

      - name: ZIP deploy via Azure CLI
        env:
          RG: ${{ vars.AZURE_WEBAPP_RG || vars.AZURE_RG || 'rg-procon-bot-prod' }}
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$RG" \
            --name "$AZURE_WEBAPP_NAME_TRIMMED" \
            --src-path "$GITHUB_WORKSPACE/painel-app-service.zip" \
            --type zip \
            --timeout 600000
