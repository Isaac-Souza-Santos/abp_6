# Publica o painel interno num Azure App Service (Linux + Node).
# Pré-requisito: App Service já criado (ex.: infra/azure/deploy-painel-app-service.ps1 uma vez).
#
# Segredos (igual ao fluxo acr-build-push):
#   AZURE_CREDENTIALS   — JSON de `az ad sp create-for-rbac --sdk-auth` (service principal com permissão
#                         no Web App / RG, ex. Website Contributor ou Contributor no rg-procon-bot-cl)
#   AZURE_WEBAPP_NAME   — nome do App Service (Overview → Name), uma linha, sem URL
#   PAINEL_VITE_API_BASE_URL
#   PAINEL_VITE_ADMIN_PANEL_TOKEN — opcional
#   PAINEL_VITE_AZURE_CLIENT_ID     — opcional (login MSAL no painel)
#   PAINEL_VITE_AZURE_TENANT_ID     — opcional
#   PAINEL_VITE_AZURE_REDIRECT_URI  — opcional (ex.: https://app-painel-xxx.azurewebsites.net/)
#
# Variável de repositório (opcional): AZURE_RG — default rg-procon-bot-cl
#
# Nota: `azure/webapps-deploy` (publish profile) falhava com ENOTFOUND / DNS em alguns runners; o deploy
# passa a ser `az webapp deploy` após `azure/login`, sem depender do hostname scm no Node.

name: Deploy painel App Service

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "painel-interno/**"
      - ".github/workflows/azure-painel-app-service.yml"

concurrency:
  group: deploy-painel-appservice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: painel-interno/package-lock.json

      - name: Build Vite e empacotar para App Service
        env:
          VITE_API_BASE_URL: ${{ secrets.PAINEL_VITE_API_BASE_URL }}
          VITE_ADMIN_PANEL_TOKEN: ${{ secrets.PAINEL_VITE_ADMIN_PANEL_TOKEN }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.PAINEL_VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.PAINEL_VITE_AZURE_TENANT_ID }}
          VITE_AZURE_REDIRECT_URI: ${{ secrets.PAINEL_VITE_AZURE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::Defina o segredo PAINEL_VITE_API_BASE_URL (URL do Container App, sem barra final)."
            exit 1
          fi
          cd painel-interno
          npm ci
          npm run build
          mkdir -p _deploy/dist
          cp -r dist/* _deploy/dist/
          cp azure-app-service-host/package.json azure-app-service-host/server.mjs _deploy/
          cd _deploy
          npm install --omit=dev
          zip -r "$GITHUB_WORKSPACE/painel-app-service.zip" .

      - name: Verificar segredos Azure (CLI deploy)
        shell: bash
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error::Segredo AZURE_CREDENTIALS vazio. Use o mesmo JSON que no workflow acr-build-push (service principal com acesso ao RG / Web App)."
            exit 1
          fi
          if [ -z "${AZURE_WEBAPP_NAME:-}" ]; then
            echo "::error::Segredo AZURE_WEBAPP_NAME vazio. Nome exacto do App Service (Overview → Name)."
            exit 1
          fi

      - name: Normalizar nome do Web App
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "$AZURE_WEBAPP_NAME" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          APP="${RAW#https://}"
          APP="${APP#http://}"
          APP="${APP%%/*}"
          APP="${APP%%\?*}"
          case "$APP" in
            *.scm.azurewebsites.us) APP="${APP%.scm.azurewebsites.us}" ;;
            *.scm.azurewebsites.net) APP="${APP%.scm.azurewebsites.net}" ;;
          esac
          case "$APP" in
            *.azurewebsites.us) APP="${APP%.azurewebsites.us}" ;;
            *.azurewebsites.net) APP="${APP%.azurewebsites.net}" ;;
          esac
          APP=$(printf '%s' "$APP" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$APP" ]; then
            echo "::error::AZURE_WEBAPP_NAME ficou vazio apos normalizar."
            exit 1
          fi
          if printf '%s' "$APP" | grep -q '[.]'; then
            echo "::error::Use apenas o Resource name do App Service (sem dominio)."
            exit 1
          fi
          echo "Nome normalizado: comprimento ${#APP} caracteres."
          echo "AZURE_WEBAPP_NAME_TRIMMED=$APP" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ZIP deploy via Azure CLI
        env:
          RG: ${{ vars.AZURE_RG || 'rg-procon-bot-cl' }}
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$RG" \
            --name "$AZURE_WEBAPP_NAME_TRIMMED" \
            --src-path "$GITHUB_WORKSPACE/painel-app-service.zip" \
            --type zip \
            --timeout 600000
